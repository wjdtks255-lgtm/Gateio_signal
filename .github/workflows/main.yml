
name: Gateio Signal Bot

on:
  schedule:
    # 매시 2, 7, 12, 17 ... 57분 실행
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'bot.py'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: gateio-signal-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check configuration
        env:
          GATE_TELEGRAM_TOKEN: ${{ secrets.GATE_TELEGRAM_TOKEN }}
          GATE_TELEGRAM_CHAT_ID: ${{ secrets.GATE_TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          print("Python workflow started")
          print("Telegram token configured:", bool(os.getenv("GATE_TELEGRAM_TOKEN")))
          print("Telegram chat ID configured:", bool(os.getenv("GATE_TELEGRAM_CHAT_ID")))
          PY

      - name: Run trading bot
        env:
          GATE_TELEGRAM_TOKEN: ${{ secrets.GATE_TELEGRAM_TOKEN }}
          GATE_TELEGRAM_CHAT_ID: ${{ secrets.GATE_TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: '1'
        run: python -u bot.py

      - name: Commit and push state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gate_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update signal state [skip ci]"
            git push origin HEAD:main
          else
            echo "State file unchanged; no commit needed."
          fi
