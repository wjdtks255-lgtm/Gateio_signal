name: Gateio Signal Bot

on:
  repository_dispatch:
    types: [run-bot-signal]
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

# 동시에 두 번 실행되어 상태 파일이 충돌하는 것을 방지
concurrency:
  group: gate-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run trading bot
        env:
          GATE_TELEGRAM_TOKEN: ${{ secrets.GATE_TELEGRAM_TOKEN }}
          GATE_TELEGRAM_CHAT_ID: ${{ secrets.GATE_TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python -u bot.py

      - name: Commit and push state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 아직 생성되지 않은 파일이 있어도 실패하지 않도록 있는 파일만 추가
          for f in gate_state.json trades.csv trades_audit.csv ai_trades.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update multi-asset state [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "State files unchanged; no commit needed."
          fi
