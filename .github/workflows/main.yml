name: Gate.io Signal Bot

on:
  # 1. 5분마다 자동 실행 (GitHub Actions 자체 스케줄러)
  schedule:
    - cron: '*/5 * * * *'

  # 2. 웹에서 수동 실행 버튼 허용
  workflow_dispatch:

  # 3. cron-job.org 외부 핑 연동을 위한 웹훅 트리거
  repository_dispatch:
    types: [trigger-bot]

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Git 커밋 권한 부여

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Bot
        env:
          GATE_TELEGRAM_TOKEN: ${{ secrets.GATE_TELEGRAM_TOKEN }}
          GATE_TELEGRAM_CHAT_ID: ${{ secrets.GATE_TELEGRAM_CHAT_ID }}
        run: |
          python bot.py
