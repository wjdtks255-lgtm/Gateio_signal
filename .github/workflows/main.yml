name: Gateio Signal Bot

on:
  repository_dispatch:
    types: [run-bot-signal]
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run trading bot
        env:
          GATE_TELEGRAM_TOKEN: ${{ secrets.GATE_TELEGRAM_TOKEN }}
          GATE_TELEGRAM_CHAT_ID: ${{ secrets.GATE_TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: '1'
        run: python -u bot.py

      - name: Commit and push state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gate_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update signal state [skip ci]"
            git push origin HEAD:main
          else
            echo "State file unchanged; no commit needed."
          fi
